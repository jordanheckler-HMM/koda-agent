[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koda-agent"
version = "0.1.0"
description = "Koda — your personal AI agent with a TUI, cron scheduler, Telegram gateway, and cross-platform tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai", "agent", "personal-assistant", "tui", "openrouter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.25.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
gemini = [
  "google-antigravity>=0.1.0",
]

[project.scripts]
koda = "koda_durable_agent.main:main"

[tool.setuptools.packages.find]
include = ["koda_durable_agent*"]
